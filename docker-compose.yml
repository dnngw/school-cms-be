# Local development helper: `docker compose up -d db` starts only PostgreSQL,
# `docker compose up -d` starts PostgreSQL + the API.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: school_cms
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/school_cms
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret-in-production-0123456789}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - '4000:4000'
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
